<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error 404</title>
  </head>
  <body>
    <header class="site-header">
      <h1>Error 404</h1>
      <button id="login-btn"></button>
      <div class="progress-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="timer"></div>


    </header>

    <main>
      <section id="start">
        <div class="start-content">
          <h2>Error 404</h2>
          <p>
            Welcome to Internet Hell. Every room is a different online nightmare.
            Solve the traps, beat the timers, and escape.
          </p>
          <button id="start-btn" type="button">Start Game</button>
          <div class="high-score">
            <h3>High Score</h3>
            <p id="high-score-value">0</p>
          </div>
        </div>
      </section>

      <section id="room1">
        <h2 id="room1-title">Verification Code</h2>
        <p>A verification code has been sent.</p>
        <p>Enter your verification code to escape.</p>

        <button id="resend-btn" type="button">Resend</button>

        <p id="room1-timer">Time: 00:00</p>

        <p>
          Code:
          <span id="flash-code" aria-live="polite">------</span>
        </p>

        <label for="code-input">Verification code</label>
        <input
          id="code-input"
          name="code-input"
          type="password"
          maxlength="6"
          autocomplete="one-time-code"
        />

        <button id="check-btn" type="button">Verify</button>
        <p id="room1-message" aria-live="polite"></p>
      </section>

      <section id="room2"></section>

      <section id="room3"></section>

      <section id="room4"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
